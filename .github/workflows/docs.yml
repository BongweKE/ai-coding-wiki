name: docs site

# Build the documentation site from wiki/ and deploy it to GitHub Pages.
# wiki/ is the source of truth; this pipeline only reads it.
#
# pull_request runs the build job only — the deploy jobs below carry an
# `if: github.event_name != 'pull_request'` guard — so a PR that breaks the
# build (an unresolved link, a missing asset) fails its checks instead of
# failing main after merge.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'mkdocs.yml'
      - 'scripts/site_hook.py'
      - 'scripts/build_site.sh'
      - 'scripts/check_site.py'
      - 'scripts/gen_llms_txt.py'
      - 'overrides/**'
      - 'site-theme/**'
      - 'assets/**'
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'wiki/**'
      - 'mkdocs.yml'
      - 'scripts/**'
      - 'overrides/**'
      - 'site-theme/**'
      - 'assets/**'
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: build the site from wiki/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Material for MkDocs
        run: pip install "mkdocs-material>=9.5,<10"

      # enablement: true turns GitHub Pages on (source: GitHub Actions)
      # the first time this workflow runs, so no manual step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: bash scripts/build_site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The same build is handed to the Cloudflare job below, which serves
      # https://vibe.bongwe.space.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Optional: publish the same build to https://vibe.bongwe.space (a Cloudflare
  # Worker serving site/ as static assets, config in wrangler.jsonc).
  #
  # It needs two repository secrets — CLOUDFLARE_API_TOKEN (Workers Scripts:Edit,
  # Workers Routes:Edit) and CLOUDFLARE_ACCOUNT_ID. Without them this job skips
  # with a notice, and the GitHub Pages mirror above is still the live site.
  #
  #   gh secret set CLOUDFLARE_API_TOKEN
  #   gh secret set CLOUDFLARE_ACCOUNT_ID --body 5a8fcb0172160f4cb5479d5fb4cb62cd
  cloudflare:
    name: deploy to vibe.bongwe.space (optional)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Is a Cloudflare token configured?
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Lengths only, never values. A secret that EXISTS can still hold an
          # empty string: `gh secret set` stores an empty or whitespace-only
          # paste with exit status 0, and the shell cannot tell that apart from
          # "unset". This line can, so keep it — it is the only visible symptom.
          echo "secret lengths: token=${#TOKEN} account=${#ACCOUNT_ID}"
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the vibe.bongwe.space deploy. The GitHub Pages mirror is still updated."
          fi

      - name: Publish to Cloudflare
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin wrangler 4: the action otherwise installs 3.x, which does not
          # read wrangler.jsonc at all. The failure is "Missing entry-point",
          # because no main and no assets were ever loaded — it looks like a
          # bad config, not a version mismatch.
          wranglerVersion: "4"
          command: deploy
