name: docs site

# Build the documentation site from wiki/ and deploy it to GitHub Pages.
# wiki/ is the source of truth; this pipeline only reads it.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'mkdocs.yml'
      - 'scripts/site_hook.py'
      - 'scripts/build_site.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: build the site from wiki/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Material for MkDocs
        run: pip install "mkdocs-material>=9.5,<10"

      # enablement: true turns GitHub Pages on (source: GitHub Actions)
      # the first time this workflow runs, so no manual step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: bash scripts/build_site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
