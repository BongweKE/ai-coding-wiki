# Documentation site for the AI Coding Wiki.
#
# wiki/ is the source of truth for every page. The site builds from a
# prepared copy (site-src/, made by scripts/build_site.sh) so that
# scripts/push_wiki.sh — the sync to the GitHub wiki — keeps working
# byte-for-byte, unchanged. Never edit site-src/ by hand.
#
# Custom domain: to serve the site at your own domain instead of
# bongweke.github.io/ai-coding-wiki/:
#   1. Add the domain in Settings -> Pages -> Custom domain.
#   2. Update site_url below to the same domain.
#   3. Enable "Enforce HTTPS" once the DNS check passes.

site_name: Coding With AI in the New Age
site_description: >-
  A free, technical, bite-sized wiki for people who are new to software
  engineering but want to build real things with AI coding agents —
  and not get burned doing it.
# The canonical URL. The site is also published to GitHub Pages as a mirror
# (bongweke.github.io/ai-coding-wiki/), but absolute URLs — canonical links,
# the sitemap, link previews and the 404 page — point at the domain.
site_url: https://vibe.bongwe.space/
repo_url: https://github.com/BongweKE/ai-coding-wiki
repo_name: BongweKE/ai-coding-wiki
edit_uri: edit/main/wiki/

docs_dir: site-src
site_dir: site

# Directory URLs (/Foo/) are the MkDocs default and the shape a static host
# serves natively: "/" resolves to index.html with no custom code, and the
# canonical URL MkDocs emits is the URL actually served (no redirect hop).
# scripts/site_hook.py hands MkDocs a source filename and MkDocs generates the
# URL, so the wiki-style links in wiki/ do not care which shape is used.
#
# This replaced `use_directory_urls: false` after the root path served a 404 on
# some edges: with flat URLs the root only worked because cloudflare/worker.js
# remapped "/" to "/index.html", and when that remap did not run, the homepage
# 404'd. The homepage should not depend on custom code.
use_directory_urls: true

# Prepared copies and wiki chrome, not source pages:
#   index.md is wiki/00-Home.md under its site name; _Sidebar.md and
#   _Footer.md are GitHub-wiki navigation — the theme sidebar and
#   prev/next navigation replace them.
exclude_docs: |
  00-Home.md
  _Sidebar.md
  _Footer.md

# Rewrite GitHub-wiki-style links ([label](Page-Name)) to site URLs at
# build time, so wiki/ pages never need .md links (check_wiki.py
# rejects them, and the GitHub wiki wants page names).
hooks:
  - scripts/site_hook.py

# Fail loudly on links MkDocs cannot resolve. `use_directory_urls: false`
# plus the wiki-style links rewritten by scripts/site_hook.py mean a
# mistyped target would otherwise ship silently — MkDocs' default levels
# are lenient. scripts/build_site.sh runs `mkdocs build --strict`, so a
# warning here fails the build.
validation:
  links:
    not_found: warn
    unrecognized_links: warn
    absolute_links: warn
  anchors: warn

theme:
  name: material
  # overrides/ adds the link-preview tags (main.html) and an absolute-link
  # 404 page that works on both the domain and the github.io mirror.
  custom_dir: overrides
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    # Colors live in site-theme/bongwe.css (copied to assets/stylesheets/ by
    # scripts/build_site.sh): bongwe.space's paper/ink/terracotta identity,
    # with a warm dark variant of it for the slate scheme. `custom` means
    # Material emits no defaults and the stylesheet defines everything.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    # bongwe.space's type system: Hanken Grotesk body, Space Mono for code.
    # Bricolage Grotesque (headings) is loaded in overrides/main.html, since
    # Material loads only a text and a code family.
    text: Hanken Grotesk
    code: Space Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.emoji

# Generated from wiki/_Sidebar.md — the same order as the wiki navigation.
# Site-level extras: the social preview image (overrides/main.html reads it),
# the repo link in the footer, and the privacy-friendly analytics switch.
# The Bongwe theme: bongwe.space's design language, as a stylesheet staged
# into the build by scripts/build_site.sh (the docs dir is generated, so
# permanent files live outside it).
extra_css:
  - assets/stylesheets/bongwe.css

extra:
  social_image: https://vibe.bongwe.space/og-card.png
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BongweKE/ai-coding-wiki
  # GoatCounter: open source, cookieless, free for non-commercial use.
  # Create an account, then put the site code here (e.g. "bongwe" for
  # https://bongwe.goatcounter.com) and scripts/site_hook.py injects the
  # script tag on every page. Empty = no analytics, no third-party requests.
  analytics_code: ""
